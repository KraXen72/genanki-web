name: Verify and deploy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pnpm install --frozen-lockfile
      - run: pnpm schemas:generate
      - name: Check generated contracts
        run: git diff --exit-code -- schemas templates src/core/*.generated.ts
      - run: pnpm runtime:prepare
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build for a repository subpath
        run: pnpm build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - run: pnpm exec playwright install --with-deps chromium firefox
      - name: Test the production site
        run: pnpm test:e2e
        env:
          E2E_PRODUCTION: '1'
          E2E_BASE_URL: http://127.0.0.1:4173/${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy static files
        id: deployment
        uses: actions/deploy-pages@v4
