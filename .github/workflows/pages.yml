name: Verify and deploy

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# jobs run one after another, so the Actions page shows which stage is running or failed
jobs:
  check:
    name: Check contracts and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm schemas:generate
      - name: Check generated contracts
        run: git diff --exit-code -- schemas templates src/core/*.generated.ts
      - run: pnpm typecheck

  test:
    name: Unit tests
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pnpm test

  build:
    name: Build site
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build for a repository subpath
        run: pnpm build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist

  browser-test:
    name: Browser tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - run: pnpm exec playwright install --with-deps chromium firefox
      - name: Test the production site
        run: pnpm test:e2e
        env:
          E2E_PRODUCTION: '1'
          E2E_BASE_URL: http://127.0.0.1:4173/${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: test-results/

  deploy:
    name: Deploy to Pages
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    needs: browser-test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/configure-pages@v5
      - name: Deploy static files
        id: deployment
        uses: actions/deploy-pages@v4
