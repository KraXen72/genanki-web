format_version = 1
key = "russian-vocabulary"
input_version = 2
name = "Russian vocabulary"
schema = "input.schema.json"
prompt = "prompt.md"
css = "style.css"

[model]
id = 1401682072
name = "Russian vocabulary v4"

[destination]
policy = "shared-source"
deck = "Ruština::Vocabulary"

[[validators]]
name = "ru-stress"
fields = ["Word", "Partner", "Sentence1", "Sentence2", "Sentence3"]
[[validators]]
name = "ru-aspect"
fields = ["Word", "Kind", "Aspect", "Partner", "Motion"]

[[tags]]
prefix = "genanki"
path = "kind"

[[fields]]
name = "ID"
path = "id"
format = "text"
[[fields]]
name = "Word"
path = "word"
format = "text"
[[fields]]
name = "Kind"
path = "kind"
format = "label"
[fields.labels]
"pod.m:m" = "podst. meno, mužský rod"
"pod.m:ž" = "podst. meno, ženský rod"
"pod.m:s" = "podst. meno, stredný rod"
"pod.m:oboj" = "podst. meno, obojrodé"
"pod.m:pomn" = "podst. meno, pomnožné"
"príd.m" = "prídavné meno"
slov = "sloveso"
"prís" = "príslovka"
"zám" = "zámeno"
"čísl" = "číslovka"
spoj = "spojka"
pred = "predložka"
"čast" = "častica"
cito = "citoslovce"
"fráza" = "fráza / ustálené spojenie"
[[fields]]
name = "Aspect"
path = "aspect"
format = "label"
[fields.labels]
impf = "impf."
pf = "pf."
both = "impf./pf."
[[fields]]
name = "Partner"
path = "partner"
format = "text"
[[fields]]
name = "Motion"
path = "motion"
format = "label"
[fields.labels]
unidir = "unidir."
multidir = "multidir."
[[fields]]
name = "Usage"
path = "usage"
format = "text"
[[fields]]
name = "SlovakMeaning1"
path = "meanings.0.sk"
format = "text"
[[fields]]
name = "EnglishGloss1"
path = "meanings.0.en"
format = "text"
[[fields]]
name = "SlovakMeaning2"
path = "meanings.1.sk"
format = "text"
[[fields]]
name = "EnglishGloss2"
path = "meanings.1.en"
format = "text"
[[fields]]
name = "SlovakMeaning3"
path = "meanings.2.sk"
format = "text"
[[fields]]
name = "EnglishGloss3"
path = "meanings.2.en"
format = "text"
[[fields]]
name = "Sentence1"
path = "meanings.0.sentence"
format = "text"
[[fields]]
name = "Translation1"
path = "meanings.0.translation"
format = "text"
[[fields]]
name = "Sentence2"
path = "meanings.1.sentence"
format = "text"
[[fields]]
name = "Translation2"
path = "meanings.1.translation"
format = "text"
[[fields]]
name = "Sentence3"
path = "meanings.2.sentence"
format = "text"
[[fields]]
name = "Translation3"
path = "meanings.2.translation"
format = "text"

[[cards]]
name = "Russian → Slovak"
front = "cards/forward.html"
back = "cards/answer.html"
[[cards]]
name = "Slovak → Russian"
front = "cards/reverse.html"
back = "cards/answer.html"
