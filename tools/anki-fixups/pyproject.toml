[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genanki-anki-fixups"
version = "0.1.0"
description = "Inspect Russian Anki notes and preview one-time collection changes"
requires-python = ">=3.11"
dependencies = ["packaging>=23"]

[project.optional-dependencies]
test = ["pytest>=8", "coverage>=7", "genanki==0.13.1"]

[project.scripts]
anki-fixups = "anki_fixups.cli:main"

[tool.setuptools.packages.find]
include = ["anki_fixups*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
